# Supabase 무료 플랜은 7일 동안 요청이 없으면 프로젝트가 일시정지되므로 주기적으로 조회 요청을 보냄
name: Supabase keepalive

on:
  schedule:
    # 3일마다 00:00 UTC (한국 시간 09:00)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase REST API 조회
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PING_TABLE: ${{ secrets.SUPABASE_PING_TABLE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_PING_TABLE" ]; then
            echo "SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_PING_TABLE 시크릿이 모두 등록되어 있어야 함"
            exit 1
          fi
          status=$(curl --fail --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "$SUPABASE_URL/rest/v1/$SUPABASE_PING_TABLE?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "응답 코드: $status"
